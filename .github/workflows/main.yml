name: AutoUpdate
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run collector
        run: python collect.py
      - name: Commit and push changes
        run: |
          git config --global user.name "nzea"
          git config --global user.email "nzea@users.noreply.github.com"
          git add sub.txt
          git commit -m "Update subscription" || exit 0
          git push
